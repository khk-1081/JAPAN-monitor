<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAPAN-monitor</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
  <link rel="stylesheet" href="./style.css">

  <script
    defer
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
  <script defer src="./app.js"></script>
</head>

<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        JAPAN<span>-monitor</span>
      </div>

      <span class="connection" id="connection-status" role="status">● 接続中…</span>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div id="information-panel"></div>

        <section id="recent-section" class="recent-section">
          <div class="section-heading">直近の入電情報</div>
          <div id="recent-list"></div>

          <button
            type="button"
            id="history-button"
            class="history-button"
          >
            過去の地震 <span>›</span>
          </button>
        </section>
      </aside>

      <section class="map-area" aria-label="地図">
        <div id="map"></div>

        <div class="map-top">
          <time id="clock" class="clock"></time>
          <span class="sample-badge" id="data-source-badge">情報取得中…</span>
        </div>

        <div id="map-caption" class="map-caption"></div>
        <div id="map-legend" class="map-legend"></div>

        <div id="map-error" class="map-error" hidden>
          地図を読み込めませんでした。
          インターネット接続を確認して再読み込みしてください。
        </div>
      </section>
    </main>

    <nav class="bottom-tabs" aria-label="画面切り替え">
      <button
        type="button"
        class="tab active"
        data-tab="earthquake"
        aria-current="page"
      >
        <svg viewBox="0 0 48 32" aria-hidden="true">
          <path d="M1 17h10l5-13 8 25 7-20 5 8h11"></path>
        </svg>
        <span>地震</span>
      </button>

      <button
        type="button"
        class="tab"
        data-tab="tsunami"
      >
        <svg viewBox="0 0 48 32" aria-hidden="true">
          <path d="M2 12c7-12 15 12 22 0S39 0 46 12"></path>
          <path d="M2 24c7-12 15 12 22 0s15-12 22 0"></path>
        </svg>
        <span>津波</span>
      </button>

      <button
        type="button"
        class="tab"
        data-tab="typhoon"
      >
        <svg viewBox="0 0 48 32" aria-hidden="true">
          <path d="M24 16c-5-7-3-13 3-15 7-2 14 4 12 11-2 7-10 10-15 4Z"></path>
          <path d="M24 16c5 7 3 13-3 15-7 2-14-4-12-11 2-7 10-10 15-4Z"></path>
          <circle cx="24" cy="16" r="2"></circle>
        </svg>
        <span>台風</span>
      </button>

      <button
        type="button"
        class="tab"
        data-tab="volcano"
      >
        <svg viewBox="0 0 48 32" aria-hidden="true">
          <path d="M3 29 18 5l6 9 5-7 16 22H3Z"></path>
          <path d="m14 12 5 3 5-1"></path>
        </svg>
        <span>火山</span>
      </button>

      <button
        type="button"
        class="tab"
        data-tab="weather-warning"
      >
        <svg viewBox="0 0 48 32" aria-hidden="true">
          <path d="M24 3 46 29H2L24 3Z"></path>
          <path d="M24 11v9"></path>
          <path d="M24 25h.01"></path>
        </svg>
        <span>気象警報</span>
      </button>
    </nav>
  </div>

  <dialog id="history-dialog">
    <div class="dialog-header">
      <h2>過去の地震</h2>
      <button type="button" id="history-close">閉じる</button>
    </div>
    <p class="dialog-note">P2P地震情報 API 経由で取得した気象庁の地震情報です。</p>
    <div id="history-list"></div>
  </dialog>
</body>
</html>
